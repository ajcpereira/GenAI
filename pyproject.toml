[project]
name = "genai-core"
version = "0.2.0"
description = "GenAI Core Phase 1 - Reasoning Orchestrator + HF/VLLM adapters"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "pytest>=8.0",
  "requests>=2.31",
  "torch",
  "transformers>=4.41",
  "accelerate>=0.31",
  "safetensors>=0.4"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
