llm:
  provider: huggingface  # huggingface | vllm
  model:
    name: mistral-7b-instruct
    path: /models/mistral-7b-instruct
  runtime:
    endpoint: http://localhost:8001   # only used when provider=vllm
    max_context_tokens: 8192
    max_new_tokens: 512
    temperature: 0.2

orchestrator:
  model:
    name: phi-3-mini
    path: /models/phi-3-mini
  reasoning:
    allow_rag: false
    allow_tools: false
    disable_model_via_env: true
  context_policy:
    allowed_topics:
      - genai-platform
      - architecture
      - python
      - devops
      - llm-serving
      - rag
      - mcp
    denied_topics:
      - politics
      - elections
      - political-parties
      - politicians

tools:
  enabled: true
  providers:
    - name: mcp
      endpoint: http://localhost:8081
      allowed_tools:
        - web.fetch

rag:
  enabled: false
