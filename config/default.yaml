llm:
  provider: huggingface
  model:
    name: mistral-7b-instruct
    path: /models/mistral-7b-instruct
  runtime:
    max_context_tokens: 8192
    max_new_tokens: 512

orchestrator:
  model:
    name: phi-3-mini
    path: /models/phi-3-mini
  reasoning:
    allow_rag: true
    allow_tools: true

tools:
  enabled: true
  providers:
    - name: mcp
      endpoint: http://localhost:8081
      allowed_tools:
        - web.fetch

rag:
  enabled: false
