api:
  host: "127.0.0.1"
  port: 8000

logging:
  level: "INFO"
  core_log_file: "./logs/core.log"

vllm:
  model_path: "/models/your-local-model"  # REQUIRED: local path to HF model directory
  served_model_name: "mistral-7b-instruct"
  host: "127.0.0.1"
  port: 8001
  # Optional: explicit interpreter (recommended for deterministic venv usage)
  # python_bin: "/home/genai/.venv/bin/python"
  log_file: "./logs/vllm.log"
  startup_timeout_s: 180
  extra_args: []

orchestrator:
  vllm_base_url: "http://127.0.0.1:8001"
  model: "mistral-7b-instruct"
  request_timeout_s: 120
  reserved_output_tokens: 128
  max_tokens_cap: 256

tools:
  mcp:
    enabled: true
    base_url: "http://127.0.0.1:8765"
    tool_name_web_search: "web_search"
    top_k: 5
    timeout_s: 10

rag:
  enabled: false
