api:
  host: "127.0.0.1"
  port: 8000

logging:
  level: "INFO"
  core_log_file: "./logs/core.log"

vllm:
  model_path: "../models/mistral-7b-instruct"  # REQUIRED: local path to HF model directory
  served_model_name: "mistral-7b-instruct"
  host: "127.0.0.1"
  port: 8001
  # Optional: explicit interpreter (recommended for deterministic venv usage)
  # python_bin: "/home/genai/.venv/bin/python"
  log_file: "./logs/vllm.log"
  startup_timeout_s: 180
  extra_args:
    # IMPORTANT: force HuggingFace tokenizer to allow chat-template override
    - "--tokenizer-mode"
    - "hf"
    # Now you may provide a chat template
    - "--chat-template"
    - "config/chat_templates/mistral_inst.jinja"
    - "--chat-template-content-format"
    - "string"



orchestrator:
  vllm_base_url: "http://127.0.0.1:8001"
  model: "mistral-7b-instruct"
  request_timeout_s: 120
  reserved_output_tokens: 128
  max_tokens_cap: 256

tools:
  mcp:
    enabled: true
    base_url: "http://127.0.0.1:8765"
    timeout_s: 30

  web_search:
    enabled: true
    tool_name: "web_search"
    provider: "brave"
    base_url: "https://api.search.brave.com/res/v1/web/search"

    auth:
      api_key_env: "BRAVE_API_KEY"

    limits:
      top_k: 5
      timeout_s: 12

  influxdb:
    enabled: true
    tool_name: "influxdb_query"
    description: "Consulta métricas e séries temporais no InfluxDB."
    routing:
      tags: ["metrics", "observability"]
      intents: ["cpu_usage", "latency"]
    connection:
      url: "http://influxdb:8086"
      org: "my-org"
      bucket: "metrics"
      token_env: "INFLUXDB_TOKEN"
    limits:
      max_rows: 5000
      timeout_s: 10


rag:
  enabled: false


launcher:
  spawn_mcp_host: true
  mcp_host_url: "http://127.0.0.1:8765"
  mcp_host_bind: "127.0.0.1"
  mcp_host_port: 8765
